services:
  ogn-monitor:
    build:
      context: .
    image: ogn-monitor:1.3.0
    restart: unless-stopped
    init: true
    env_file:
      - docker.env
    environment:
      OGN_RUNTIME_MODE: docker
      OGN_DATABASE: /data/ogn.sqlite3
      OGN_DDB_FILE: /data/ogn-ddb.json
      OGN_WEB_HOST: 0.0.0.0
      OGN_WEB_PORT: 5000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${OGN_HTTP_PORT:-5000}:5000"
    volumes:
      - ogn-data:/data

volumes:
  ogn-data:
